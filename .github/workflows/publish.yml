# Publish the package to PyPI when a new version tag is pushed (e.g. v0.0.1).
# Uses PyPI Trusted Publishing (OIDC) — no API token required.
# See: https://docs.pypi.org/trusted-publishers/

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify submodules are present
        run: test -f src/lst_builder/assets/pyproject.toml

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/project/lst-builder/
    permissions:
      # Required for Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish